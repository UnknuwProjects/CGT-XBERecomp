# Recompiler input for default.xbe, written by xbe_symbols

[xbe]
path = "assets/default.xbe"
title = 0x5343000C
entry = 0x109A44
xdk = 5849
out = "generated/game"
partitions = 128
code_sections = [".text", "XNET", "XONLINE", "D3D", "D3DX", "M06_SEG", "T00B_SEG", "M08_SEG", "M02_SEG", "T00A_SEG", "M09_SEG", "M01_SEG", "M14_SEG", "M11_SEG", "M07_SEG", "M03_SEG", "M13_SEG", "M10_SEG", "M15_SEG", "M05_SEG", "M12_SEG", "M04_SEG", "XGRPH", "DSOUND", "WMADEC", "BINK", "BINK32", "BINK32A", "BINK16", "BINK4444", "BINK5551", "BINKYUY2", "BINK16MX", "BINK16X2", "BINK16M", "BINK32MX", "BINK32X2", "BINK32M", "XPP", "M02_DAT", "T00A_DAT", "M03_DAT", "M05_DAT", "M12_DAT", "M06_DAT", "M08_DAT", "M09_DAT", "M01_DAT", "M14_DAT", "M11_DAT", "M07_DAT", "M10_DAT", "M15_DAT", "M04_DAT"]
